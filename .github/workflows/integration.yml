name: integration

# The real thing on a throwaway VM: btrfs, mdadm and ZFS arrays on loop files (built, scrubbed, broken), Podman
# containers, a k3s cluster, and the systemd kiosk service. Each step runs `tmon --once` and checks the screen.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  real-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mdadm zfsutils-linux btrfs-progs podman >/dev/null
      - name: install.sh
        run: sudo --preserve-env=CI tests/integration/run.sh install
      - name: btrfs RAID1
        run: sudo --preserve-env=CI tests/integration/run.sh btrfs
      - name: mdadm RAID1
        run: sudo --preserve-env=CI tests/integration/run.sh mdadm
      - name: ZFS mirror
        run: sudo --preserve-env=CI tests/integration/run.sh zfs
      - name: Podman
        run: sudo --preserve-env=CI tests/integration/run.sh podman
      - name: k3s
        run: sudo --preserve-env=CI tests/integration/run.sh k3s
      - name: kiosk service
        run: sudo --preserve-env=CI tests/integration/run.sh kiosk
