[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tmon"
dynamic = ["version"]
description = "Full-screen terminal status monitor for home servers and NAS boxes: health, storage, UPS, containers, backups and live web traffic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "khangzxrr" }]
classifiers = ["Environment :: Console", "Operating System :: POSIX :: Linux", "Topic :: System :: Monitoring"]

[project.scripts]
tmon = "tmon.cli:main"

[tool.setuptools]
packages = ["tmon"]

[tool.setuptools.dynamic]
version = { attr = "tmon.__version__" }

# Tests must cover at least 90 % of lines and branches: enforced by CI (.github/workflows/tests.yml) and the pre-push
# hook. Run locally: python3 -m coverage run -m unittest && python3 -m coverage report
[tool.coverage.run]
branch = true
source = ["tmon"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
